name: PHPUnit CI

on:
    pull_request:
        branches:
            - main

jobs:
    phpunit:
        name: PHPUnit on PHP ${{ matrix.php-versions }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-versions: [ '8.3', '8.4' ]

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Set up PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    extensions: mbstring, intl
                    tools: composer:2

            -   name: Cache composer
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.composer/cache
                        ~/.cache/composer
                    key: composer-${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
                    restore-keys: composer-${{ runner.os }}-php-${{ matrix.php-versions }}-

            -   name: Install dependencies
                run: composer install --no-progress --no-suggest --prefer-dist --no-interaction

            -   name: Run PHPUnit
                run: vendor/bin/phpunit --configuration phpunit.xml --colors=always

